# 复制为 config.toml 后填写真实配置；config.toml 不提交 Git。

[app]
env = "production"
addr = ":8999"
token_secret = "请填写至少32位随机字符串"
filing_number = "陇ICP备2026008700号-2"
# 公安备案审核期间临时展示静态首页；审核通过后改为 false。
