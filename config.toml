# Friends Records 项目配置文件。
# 程序启动时会直接读取本文件，修改后需要重启程序才能生效。

[app]
# 运行环境：开发环境填写 development，正式环境填写 production。
env = "production"
# HTTP 服务监听地址。:8080 表示监听本机所有网卡的 8080 端口。
addr = ":8999"
# 小程序登录 Token 的签名密钥，不是微信密钥。
# 开发环境可以留空，程序会在每次启动时生成临时密钥。
# 正式环境必须填写至少32个字符，推荐执行 openssl rand -hex 32 生成64位随机字符串。
# 不要使用姓名、手机号、生日或常见句子。
token_secret = "9b33a573914d14dd3c87fadaf9e0b2b45241b5b9110831e325757a5edf397b91"
filing_number = "陇ICP备2026008700号-2"
# 公安备案审核期间临时展示静态首页；审核通过后改为 false。
filing_landing = true
# 每月公休天数；应出勤天数=当月自然日数-该值，后续可按校历调整。
monthly_rest_days = 3

[mysql]
# 留空时程序仍可启动，但员工、工资、台账等数据页面会返回“数据库尚未配置”。
# 程序只连接数据库，不会自动创建数据库或数据表。
# 本地 MySQL 配置示例：
# dsn = "root:password@tcp(127.0.0.1:3306)/friends_records?charset=utf8mb4&parseTime=true&loc=Local"
dsn = "root:ZhaoJia@0424@tcp(47.94.206.184:3306)/xx_taizhang?charset=utf8mb4&parseTime=true&loc=Local"

[upload]
# 上传文件保存目录。相对路径以程序启动目录为基准；服务器上建议填写自己的绝对目录。
# 服务器示例：dir = "/data/friends-records/uploads"
dir = "data/uploads"
# 单张证件/台账凭证图片大小上限，单位MB，允许1到20。
max_size_mb = 5

[wechat]
# 微信小程序 AppID。
app_id = "wx61a14738b3d98047"
# 微信小程序 AppSecret，只能保存在服务端，不能写进小程序前端代码。
# 正式使用前在这里填写，并注意不要把本配置文件提交到 Git。
app_secret = "6b3f2f143632b03733c805805a0980d4"
# 是否使用模拟登录。true 不调用微信接口，仅用于本地开发；正式环境必须改成 false。
mock_login = false
# 是否允许首次登录的小程序用户自动启用。
# true 表示自动启用；false 表示需要管理员在数据库中手动启用。
# 新用户默认停用，需管理员手动启用后才能使用小程序
auto_register = false
