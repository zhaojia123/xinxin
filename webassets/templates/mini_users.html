<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小程序权限 · 好友记录</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head><body><div class="admin-shell">{{template "sidebar" .}}<main class="admin-main">
<header class="admin-topbar"><div><p class="breadcrumb">系统管理 / 小程序权限</p><h1>小程序用户权限</h1><p class="page-description">控制每位小程序用户可以看到和使用的业务导航。</p></div><button class="ghost-button" data-mini-refresh>刷新</button></header>
<section class="notice-card"><span>权</span><div><strong>权限变更后重新登录小程序</strong><p>未勾选的模块会从底部导航隐藏，接口也会拒绝访问。停用用户后将无法继续使用小程序。</p></div></section>
<section class="table-card" data-mini-users><div class="table-header"><div><h2>用户列表</h2><p>可填写备注名称区分用户，模块权限可随时调整，不会删除历史业务数据</p></div><span class="count-badge" data-mini-count>0 位</span></div><div class="record-dialog-error mini-users-error" data-mini-error></div><div class="table-wrap"><table><thead><tr data-mini-head><th>用户</th><th>状态</th></tr></thead><tbody data-mini-body><tr><td colspan="2" class="empty-cell">正在加载小程序用户…</td></tr></tbody></table></div></section>
</main></div><div class="demo-toast"></div></body></html>
