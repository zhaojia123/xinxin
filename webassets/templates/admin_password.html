<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改后台密码 · 好友记录</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head>
<body><div class="admin-shell">{{template "sidebar" .}}<main class="admin-main"><header class="admin-topbar"><div><p class="breadcrumb">系统管理 / 账户安全</p><h1>修改后台登录密码</h1><p class="page-description">修改成功后会立即退出后台，请使用新密码重新登录。</p></div></header>
<section class="account-password-layout"><div class="account-password-intro"><span class="account-password-icon">锁</span><div><h2>保护后台账户</h2><p>修改后当前登录会立即失效；请使用新密码重新进入后台。</p></div><ul><li>长度为 8 至 128 位</li><li>建议混合使用字母、数字和符号</li><li>不要与其他系统共用密码</li></ul></div><section class="table-card account-password-card"><div class="table-header"><div><h2>设置新密码</h2><p>请先验证当前密码，再设置一个新的登录密码。</p></div></div><form class="record-dialog-form account-password-form" method="post" action="/admin/password"><label><span>当前密码</span><input name="current_password" type="password" autocomplete="current-password" required maxlength="128" placeholder="输入当前登录密码"></label><label><span>新密码</span><input name="new_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="至少 8 位"></label><label><span>确认新密码</span><input name="confirm_password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="再次输入新密码"></label>{{if .Error}}<div class="record-dialog-error">{{.Error}}</div>{{end}}<div class="form-actions"><a class="ghost-button" href="/admin/employees">取消</a><button class="primary-button" type="submit">确认修改并退出</button></div></form></section></section></main></div><div class="demo-toast"></div></body></html>
