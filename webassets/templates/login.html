<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台登录 · 好友记录</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-mark">FR</div>
      <p class="eyebrow">FRIENDS RECORDS</p>
      <h1>后台登录</h1>
      <p class="muted">管理成员、数据记录和统计信息</p>

      {{if .Error}}<div class="alert">{{.Error}}</div>{{end}}

      <form method="post" action="/admin/login" class="form-stack">
        <label>
          <span>用户名</span>
          <input name="username" value="{{.Username}}" autocomplete="username" required maxlength="64" placeholder="请输入用户名">
        </label>
        <label>
          <span>密码</span>
          <input type="password" name="password" autocomplete="current-password" required maxlength="128" placeholder="请输入密码">
        </label>
        <button type="submit" class="primary-button">登录后台</button>
      </form>

      <!-- 备案成功后，将占位文字替换为实际备案号。 -->
      <div class="filing-info" aria-label="网站备案信息">
        <span>备案号：待备案完成后填写</span>
        <a href="https://beian.miit.gov.cn" target="_blank" rel="noreferrer">工信部备案查询</a>
      </div>
    </section>
  </main>
</body>
</html>
