<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作日志 · 好友记录</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head><body><div class="admin-shell">{{template "sidebar" .}}<main class="admin-main">
<header class="admin-topbar"><div><p class="breadcrumb">系统管理 / 操作日志</p><h1>操作日志</h1><p class="page-description">记录重要数据的查看、修改、审批与导出操作</p></div><button class="ghost-button" data-demo-action="导出操作日志">导出日志</button></header>
<section class="notice-card"><span>安</span><div><strong>敏感操作需要留痕</strong><p>接入数据库后，身份证、工资、请假与异常记录的查看和修改都应自动写入日志。</p></div></section>
<section class="table-card"><div class="table-toolbar"><input type="date"><select><option>全部模块</option><option>员工管理</option><option>请假管理</option><option>工资管理</option></select><div class="search-box">⌕ <input placeholder="搜索操作人或对象"></div></div><div class="table-header"><div><h2>最近操作</h2><p>敏感数据操作留痕</p></div><span class="count-badge">{{len .AuditLogs}} 条</span></div><div class="table-wrap"><table><thead><tr><th>操作时间</th><th>操作人</th><th>模块</th><th>动作</th><th>操作对象</th><th>IP 地址</th><th>结果</th></tr></thead><tbody>{{range .AuditLogs}}<tr><td class="mono">{{.Time}}</td><td><strong>{{.Operator}}</strong></td><td>{{.Module}}</td><td><span class="soft-badge">{{.Action}}</span></td><td>{{.Target}}</td><td class="mono">{{.IP}}</td><td><span class="status {{.ResultClass}}">{{.Result}}</span></td></tr>{{else}}<tr><td colspan="7" class="empty-cell">暂无操作日志</td></tr>{{end}}</tbody></table></div></section>
</main></div><div class="demo-toast"></div></body></html>
