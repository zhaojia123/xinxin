<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.PageTitle}} · 好友记录</title><link rel="stylesheet" href="/assets/app.css"><script defer src="/assets/app.js"></script></head>
<body><div class="admin-shell">{{template "sidebar" .}}<main class="admin-main narrow-main">
<header class="admin-topbar"><div><p class="breadcrumb"><a href="{{.ReturnTo}}">员工档案</a> / {{.PageTitle}}</p><h1>{{.PageTitle}}</h1><p class="page-description">只填写临时工实际需要的信息，保存后返回进入前的员工列表</p></div></header>
{{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
<form class="detail-card temporary-employee-form" method="post" data-employee-form>
  <input type="hidden" name="temporary" value="1"><input type="hidden" name="employee_no" value="{{.Form.EmployeeNo}}"><input type="hidden" name="gender" value="unknown"><input type="hidden" name="employment_status" value="active"><input type="hidden" name="employment_type" value="part_time">
  <div class="form-section"><div class="section-title"><div><h2>临时工信息</h2><p>员工类型固定为兼职，不建立单独的临时工表。</p></div></div><div class="form-grid">
    <label>姓名 *<input name="name" required maxlength="64" value="{{.Form.Name}}" placeholder="请输入姓名"></label>
    <label>手机号<input name="mobile" maxlength="32" value="{{.Form.Mobile}}" placeholder="选填"></label>
    <label class="span-2">身份证号<input name="id_card" maxlength="32" value="{{.Form.IDCard}}" placeholder="选填，完整身份证号"></label>
  </div></div>
  <div class="form-section"><div class="section-title"><div><h2>计薪与日期</h2><p>这里仅保存计薪方式和单价；每日出勤请在“登记临时工工时”中填写。</p></div></div><div class="form-grid">
    <label>员工类型<input value="临时工" disabled></label>
    <label>记薪方式<select name="pay_basis"><option value="hourly" {{if eq .Form.PayBasis "hourly"}}selected{{end}}>按小时</option><option value="daily" {{if eq .Form.PayBasis "daily"}}selected{{end}}>按天</option><option value="half_daily" {{if eq .Form.PayBasis "half_daily"}}selected{{end}}>按半天</option></select></label>
    <label>计薪标准（元）<input name="current_salary" type="number" min="0" max="9999999999.99" step="0.01" value="{{.Form.CurrentSalary}}" placeholder="按记薪方式填写"></label>
    <label>入职时间<input name="joined_on" type="date" value="{{.Form.JoinedOn}}" required></label>
    <label>离职日期<input name="left_on" type="date" value="{{.Form.LeftOn}}"></label>
  </div></div>
  <div class="form-actions"><a class="ghost-button link-button" href="{{.ReturnTo}}">取消</a><button class="primary-button" type="submit">保存临时工</button></div>
</form></main></div><div class="demo-toast" role="status"></div></body></html>
